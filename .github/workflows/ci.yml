name: CI

# 每次 push / 发 tag / 提 PR 时跑测试套件。
# 测试用 isolate-home 把 DSH_HOME 顶到临时目录，绝不读写真实片段库。

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（锁定版本）
        shell: bash
        run: npm ci

      - name: ESLint
        shell: bash
        run: npm run lint

      - name: 语法检查（host 半 + client 半）
        shell: bash
        run: |
          node --check index.js
          node --check client.js

      - name: 测试套件
        run: npm test
