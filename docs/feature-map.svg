<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1160" height="640" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1159" height="639" rx="12" fill="none" stroke="#30363d"/>

  <!-- title -->
  <text x="30" y="44" font-size="21" font-weight="700" fill="#58a6ff">📋 提示词片段库 · Prompt Snippets</text>
  <text x="30" y="68" font-size="13" fill="#8b949e">左侧是插件真实界面（输入框下方的 dock 面板），右侧是点击片段时的「三态填充」流程</text>

  <!-- ═══════════ 左栏：插件界面 mockup ═══════════ -->
  <text x="30" y="96" font-size="15" font-weight="700" fill="#e6edf3">① 插件界面（dock 面板）</text>

  <!-- 面板外框 -->
  <rect x="30" y="108" width="500" height="508" rx="10" fill="#161b22" stroke="#30363d"/>

  <!-- 标题栏 -->
  <rect x="30" y="108" width="500" height="30" rx="10" fill="#161b22"/>
  <rect x="30" y="128" width="500" height="10" fill="#161b22"/>
  <line x1="30" y1="138" x2="530" y2="138" stroke="#21262d"/>
  <text x="44" y="128" font-size="12" font-weight="600" fill="#c9d1d9">📋 片段库</text>
  <text x="510" y="128" font-size="14" fill="#8b949e">×</text>

  <!-- 搜索框 -->
  <rect x="42" y="146" width="476" height="28" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="52" y="164" font-size="12" fill="#8b949e">🔍 搜索名称 / 分类 / 内容…</text>

  <!-- 视图栏 -->
  <rect x="42" y="182" width="46" height="22" rx="999" fill="#21262d" stroke="#30363d"/>
  <text x="65" y="197" font-size="11" fill="#c9d1d9" text-anchor="middle">全部</text>
  <rect x="94" y="182" width="60" height="22" rx="999" fill="none" stroke="#30363d"/>
  <text x="124" y="197" font-size="11" fill="#8b949e" text-anchor="middle">★ 收藏</text>
  <rect x="160" y="182" width="72" height="22" rx="999" fill="none" stroke="#30363d"/>
  <text x="196" y="197" font-size="11" fill="#8b949e" text-anchor="middle">最近使用</text>

  <!-- 列表：分类「开发」 -->
  <text x="50" y="226" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="0.03em">开发</text>

  <!-- 行 1：代码审查（选中/悬停态，带高亮 + ★置顶 + 四 icon） -->
  <rect x="42" y="234" width="476" height="28" rx="5" fill="#21262d"/>
  <text x="52" y="253" font-size="12" fill="#f0b72f">★</text>
  <text x="64" y="253" font-size="13" fill="#e6edf3">代码审查</text>
  <rect x="128" y="241" width="34" height="15" rx="999" fill="#30363d"/>
  <text x="145" y="252" font-size="10" fill="#8b949e" text-anchor="middle">代码</text>
  <rect x="166" y="241" width="34" height="15" rx="999" fill="#30363d"/>
  <text x="183" y="252" font-size="10" fill="#8b949e" text-anchor="middle">审查</text>
  <text x="448" y="253" font-size="11" fill="#8b949e">✏️</text>
  <text x="468" y="253" font-size="11" fill="#8b949e">🕘</text>
  <text x="488" y="253" font-size="11" fill="#8b949e">✨</text>
  <text x="508" y="253" font-size="11" fill="#f85149">🗑</text>

  <!-- 行 2：Git 提交信息 -->
  <rect x="42" y="266" width="476" height="28" rx="5" fill="none"/>
  <text x="52" y="285" font-size="13" fill="#c9d1d9">Git 提交信息</text>
  <rect x="150" y="273" width="26" height="15" rx="999" fill="#21262d"/>
  <text x="163" y="284" font-size="10" fill="#8b949e" text-anchor="middle">git</text>
  <rect x="180" y="273" width="34" height="15" rx="999" fill="#21262d"/>
  <text x="197" y="284" font-size="10" fill="#8b949e" text-anchor="middle">提交</text>
  <text x="448" y="285" font-size="11" fill="#8b949e">✏️</text>
  <text x="468" y="285" font-size="11" fill="#8b949e">🕘</text>
  <text x="488" y="285" font-size="11" fill="#8b949e">✨</text>
  <text x="508" y="285" font-size="11" fill="#f85149">🗑</text>

  <!-- 行 3：Bug 排查 -->
  <rect x="42" y="298" width="476" height="28" rx="5" fill="none"/>
  <text x="52" y="317" font-size="13" fill="#c9d1d9">Bug 排查</text>
  <rect x="118" y="305" width="28" height="15" rx="999" fill="#21262d"/>
  <text x="132" y="316" font-size="10" fill="#8b949e" text-anchor="middle">bug</text>
  <rect x="150" y="305" width="34" height="15" rx="999" fill="#21262d"/>
  <text x="167" y="316" font-size="10" fill="#8b949e" text-anchor="middle">排查</text>
  <text x="448" y="317" font-size="11" fill="#8b949e">✏️</text>
  <text x="468" y="317" font-size="11" fill="#8b949e">🕘</text>
  <text x="488" y="317" font-size="11" fill="#8b949e">✨</text>
  <text x="508" y="317" font-size="11" fill="#f85149">🗑</text>

  <!-- 分类「写作」 -->
  <text x="50" y="350" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="0.03em">写作</text>

  <!-- 行 4：周报 -->
  <rect x="42" y="358" width="476" height="28" rx="5" fill="none"/>
  <text x="52" y="377" font-size="13" fill="#c9d1d9">周报</text>
  <rect x="84" y="365" width="34" height="15" rx="999" fill="#21262d"/>
  <text x="101" y="376" font-size="10" fill="#8b949e" text-anchor="middle">周报</text>
  <rect x="122" y="365" width="34" height="15" rx="999" fill="#21262d"/>
  <text x="139" y="376" font-size="10" fill="#8b949e" text-anchor="middle">工作</text>
  <text x="448" y="377" font-size="11" fill="#8b949e">✏️</text>
  <text x="468" y="377" font-size="11" fill="#8b949e">🕘</text>
  <text x="488" y="377" font-size="11" fill="#8b949e">✨</text>
  <text x="508" y="377" font-size="11" fill="#f85149">🗑</text>

  <!-- 行 5：翻译润色 -->
  <rect x="42" y="390" width="476" height="28" rx="5" fill="none"/>
  <text x="52" y="409" font-size="13" fill="#c9d1d9">翻译润色</text>
  <rect x="112" y="397" width="34" height="15" rx="999" fill="#21262d"/>
  <text x="129" y="408" font-size="10" fill="#8b949e" text-anchor="middle">翻译</text>
  <rect x="150" y="397" width="34" height="15" rx="999" fill="#21262d"/>
  <text x="167" y="408" font-size="10" fill="#8b949e" text-anchor="middle">润色</text>
  <text x="448" y="409" font-size="11" fill="#8b949e">✏️</text>
  <text x="468" y="409" font-size="11" fill="#8b949e">🕘</text>
  <text x="488" y="409" font-size="11" fill="#8b949e">✨</text>
  <text x="508" y="409" font-size="11" fill="#f85149">🗑</text>

  <!-- 底部按钮行 -->
  <rect x="42" y="540" width="64" height="24" rx="5" fill="none" stroke="#30363d"/>
  <text x="74" y="556" font-size="11" fill="#c9d1d9" text-anchor="middle">＋ 新建</text>
  <rect x="112" y="540" width="64" height="24" rx="5" fill="none" stroke="#30363d"/>
  <text x="144" y="556" font-size="11" fill="#c9d1d9" text-anchor="middle">⬇ 导出</text>
  <rect x="182" y="540" width="64" height="24" rx="5" fill="none" stroke="#30363d"/>
  <text x="214" y="556" font-size="11" fill="#c9d1d9" text-anchor="middle">⬆ 导入</text>

  <!-- 底部提示 -->
  <line x1="30" y1="574" x2="530" y2="574" stroke="#21262d"/>
  <text x="42" y="592" font-size="10" fill="#8b949e">点名称插入 · ✏️ 编辑 · 🕘 历史 · ✨ 优化 · 🗑 删除 · 拖标题栏移动 · 拖边缘调大小</text>

  <!-- dock 按钮示意 -->
  <rect x="30" y="622" width="92" height="14" rx="6" fill="none" stroke="#30363d"/>
  <text x="76" y="632" font-size="9" fill="#8b949e" text-anchor="middle">📋 片段库 dock 按钮</text>

  <!-- ═══════════ 右栏：三态填充流程 ═══════════ -->
  <text x="560" y="96" font-size="15" font-weight="700" fill="#e6edf3">② 点击片段时的三态填充流程</text>

  <!-- 步骤 1 -->
  <rect x="560" y="108" width="570" height="42" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="578" y="134" font-size="13" fill="#c9d1d9">点击某条片段</text>

  <!-- 步骤 2 -->
  <rect x="560" y="160" width="570" height="42" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="578" y="186" font-size="13" fill="#c9d1d9">扫描正文中的 <tspan fill="#79c0ff">{{占位符}}</tspan>，按「必填 / 默认值 / 无变量」分三态</text>

  <!-- 箭头 步骤2 -> 三卡 -->
  <line x1="650" y1="202" x2="650" y2="222" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="845" y1="202" x2="845" y2="222" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1040" y1="202" x2="1040" y2="222" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 卡 1 -->
  <rect x="560" y="222" width="180" height="148" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="586" cy="250" r="12" fill="#1f2937" stroke="#3fb950"/>
  <text x="586" y="255" font-size="12" fill="#3fb950" text-anchor="middle">①</text>
  <text x="604" y="255" font-size="14" font-weight="600" fill="#e6edf3">无占位符</text>
  <text x="578" y="282" font-size="12" fill="#8b949e">正文不含任何 {{变量}}</text>
  <rect x="576" y="300" width="148" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="650" y="321" font-size="12" fill="#3fb950" text-anchor="middle">→ 直接插入草稿</text>
  <text x="578" y="354" font-size="10.5" fill="#8b949e">例如：「周报」模板</text>

  <!-- 卡 2 -->
  <rect x="755" y="222" width="180" height="148" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="781" cy="250" r="12" fill="#1f2937" stroke="#58a6ff"/>
  <text x="781" y="255" font-size="12" fill="#58a6ff" text-anchor="middle">②</text>
  <text x="799" y="255" font-size="14" font-weight="600" fill="#e6edf3">全有默认值</text>
  <text x="773" y="282" font-size="12" fill="#8b949e">变量都非必填且带默认值</text>
  <rect x="771" y="300" width="148" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="845" y="321" font-size="12" fill="#58a6ff" text-anchor="middle">→ 按默认值插入</text>
  <text x="773" y="354" font-size="10.5" fill="#8b949e">{{目标语言}} 默认「英文」</text>

  <!-- 卡 3 -->
  <rect x="950" y="222" width="180" height="148" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="976" cy="250" r="12" fill="#1f2937" stroke="#f0883e"/>
  <text x="976" y="255" font-size="12" fill="#f0883e" text-anchor="middle">③</text>
  <text x="994" y="255" font-size="14" font-weight="600" fill="#e6edf3">有必填项</text>
  <text x="968" y="282" font-size="12" fill="#8b949e">弹表单逐项填写 / 枚举下拉</text>
  <rect x="966" y="300" width="148" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="1040" y="321" font-size="12" fill="#f0883e" text-anchor="middle">→ 填写后合成插入</text>
  <text x="968" y="354" font-size="10.5" fill="#8b949e">{{代码}} 必填 → 弹输入框</text>

  <!-- 箭头 三卡 -> 合并 -->
  <line x1="650" y1="370" x2="650" y2="392" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="845" y1="370" x2="845" y2="392" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1040" y1="370" x2="1040" y2="392" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 合并 -->
  <rect x="560" y="392" width="570" height="60" rx="10" fill="#161b22" stroke="#58a6ff"/>
  <text x="845" y="418" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">合成文本填入输入框草稿</text>
  <text x="845" y="438" font-size="11.5" fill="#8b949e" text-anchor="middle">可继续编辑后发送 · \{{字面量}} 转义 · 同名变量只问一次 · 动态宏 {{date}}/{{time}} 自动替换</text>

  <!-- 底部脚注 -->
  <text x="560" y="478" font-size="11" fill="#6e7681">示意图，非实际截图 · 真实交互见插件内的 dock 面板</text>
</svg>
